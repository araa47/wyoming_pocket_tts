---
name: On PR

on:
    pull_request:
        branches: [main]
        types:
            - opened
            - reopened
            - synchronize
            - ready_for_review

# Cancel superseded runs when new commits are pushed to the PR.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    prek:
        uses: ./.github/workflows/job-prek.yml

    test:
        uses: ./.github/workflows/job-test.yml
        permissions:
            contents: read
            id-token: write
